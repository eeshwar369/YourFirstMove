<div class="ai-assistant-container" [class.open]="isOpen">
  <button
    *ngIf="!isOpen && aiStatus?.available"
    class="ai-fab"
    (click)="toggleChat()"
    title="Open AI Assistant">
    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 10h.01M12 10h.01M16 10h.01M9 16H5a2 2 0 01-2-2V6a2 2 0 012-2h14a2 2 0 012 2v8a2 2 0 01-2 2h-5l-5 5v-5z" />
    </svg>
    <span class="ai-badge" *ngIf="messages.length > 0">{{ messages.length }}</span>
  </button>

  <div class="ai-chat-window" *ngIf="isOpen">
    <div class="ai-chat-header">
      <div class="header-content">
        <div class="ai-avatar">
          <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9.663 17h4.673M12 3v1m6.364 1.636l-.707.707M21 12h-1M4 12H3m3.343-5.657l-.707-.707m2.828 9.9a5 5 0 117.072 0l-.548.547A3.374 3.374 0 0014 18.469V19a2 2 0 11-4 0v-.531c0-.895-.356-1.754-.988-2.386l-.548-.547z" />
          </svg>
        </div>
        <div class="header-info">
          <h3>AI Assistant</h3>
          <p class="status" *ngIf="aiStatus">
            <span class="status-dot" [class.active]="aiStatus.available"></span>
            {{ aiStatus.available ? 'Online' : 'Offline' }}
            <span *ngIf="aiStatus.available && aiStatus.providerStatus.length > 0">
              - {{ aiStatus.providerStatus[0].model }}
            </span>
          </p>
        </div>
      </div>
      <div class="header-actions">
        <button class="icon-btn" (click)="getSuggestions()" title="Get Suggestions">
          <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9.663 17h4.673M12 3v1m6.364 1.636l-.707.707M21 12h-1M4 12H3m3.343-5.657l-.707-.707m2.828 9.9a5 5 0 117.072 0l-.548.547A3.374 3.374 0 0014 18.469V19a2 2 0 11-4 0v-.531c0-.895-.356-1.754-.988-2.386l-.548-.547z" />
          </svg>
        </button>
        <button class="icon-btn" (click)="clearConversation()" title="Clear Conversation">
          <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" />
          </svg>
        </button>
        <button class="icon-btn" (click)="toggleChat()" title="Close">
          <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
          </svg>
        </button>
      </div>
    </div>

    <div class="ai-messages" #messagesContainer>
      <div *ngIf="messages.length === 0 && !isLoading" class="empty-state">
        <div class="empty-icon">
          <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 12h.01M12 12h.01M16 12h.01M21 12c0 4.418-4.03 8-9 8a9.863 9.863 0 01-4.255-.949L3 20l1.395-3.72C3.512 15.042 3 13.574 3 12c0-4.418 4.03-8 9-8s9 3.582 9 8z" />
          </svg>
        </div>
        <h4>Start a conversation</h4>
        <p>Ask me about your tasks, schedule, analytics, or settings.</p>

        <div class="quick-actions">
          <button class="quick-action-btn" (click)="quickAction('today')">
            Today's Tasks
          </button>
          <button class="quick-action-btn" (click)="quickAction('create')">
            Create Task
          </button>
          <button class="quick-action-btn" (click)="quickAction('analytics')">
            Analytics
          </button>
          <button class="quick-action-btn" (click)="quickAction('suggestions')">
            Suggestions
          </button>
        </div>
      </div>

      <div
        *ngFor="let message of messages"
        class="message"
        [class.user]="message.role === 'user'"
        [class.assistant]="message.role === 'assistant'">
        <div class="message-avatar" *ngIf="message.role === 'assistant'">
          <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9.663 17h4.673M12 3v1m6.364 1.636l-.707.707M21 12h-1M4 12H3m3.343-5.657l-.707-.707m2.828 9.9a5 5 0 117.072 0l-.548.547A3.374 3.374 0 0014 18.469V19a2 2 0 11-4 0v-.531c0-.895-.356-1.754-.988-2.386l-.548-.547z" />
          </svg>
        </div>
        <div class="message-content">
          <div class="message-text">{{ message.content }}</div>
          <div class="message-meta">
            <span class="message-time">{{ message.timestamp | date:'short' }}</span>
            <span class="message-action" *ngIf="message.actions?.length">
              - {{ message.actions?.join(', ') }}
            </span>
          </div>
        </div>
      </div>

      <div *ngIf="isLoading" class="message assistant">
        <div class="message-avatar">
          <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9.663 17h4.673M12 3v1m6.364 1.636l-.707.707M21 12h-1M4 12H3m3.343-5.657l-.707-.707m2.828 9.9a5 5 0 117.072 0l-.548.547A3.374 3.374 0 0014 18.469V19a2 2 0 11-4 0v-.531c0-.895-.356-1.754-.988-2.386l-.548-.547z" />
          </svg>
        </div>
        <div class="message-content">
          <div class="typing-indicator">
            <span></span>
            <span></span>
            <span></span>
          </div>
        </div>
      </div>
    </div>

    <div class="ai-input-container">
      <div class="provider-selector" *ngIf="aiStatus && aiStatus.providers.length > 1">
        <select [(ngModel)]="selectedProvider" class="provider-select">
          <option value="auto">Auto</option>
          <option value="openai" *ngIf="aiStatus.providers.includes('openai')">OpenAI</option>
          <option value="anthropic" *ngIf="aiStatus.providers.includes('anthropic')">Anthropic</option>
        </select>
      </div>
      <div class="input-wrapper">
        <textarea
          [(ngModel)]="userInput"
          (keypress)="onKeyPress($event)"
          placeholder="Ask me anything..."
          rows="1"
          [disabled]="!aiStatus?.available || isLoading"
          class="ai-input"></textarea>
        <button
          (click)="sendMessage()"
          [disabled]="!userInput.trim() || !aiStatus?.available || isLoading"
          class="send-btn"
          title="Send message">
          <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 19l9 2-9-18-9 18 9-2zm0 0v-8" />
          </svg>
        </button>
      </div>
    </div>
  </div>
</div>
