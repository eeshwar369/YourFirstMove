[build]
  base = "frontend"
  command = "npm run build"
  publish = "dist/yourfirstmove-frontend"

[build.environment]
  NODE_VERSION = "18.20.6"

[[redirects]]
  from = "/api/*"
  to = "https://yourfirstmove.onrender.com/api/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
