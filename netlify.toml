[build]
  base = "frontend"
  command = "npm run build"
  publish = "dist/yourfirstmove-frontend"

[build.environment]
  NODE_VERSION = "18.20.6"

# After your Render backend is live, either change Angular's production apiUrl
# to the Render URL or uncomment this proxy and replace the hostname.
# [[redirects]]
#   from = "/api/*"
#   to = "https://your-render-backend-url.onrender.com/api/:splat"
#   status = 200
#   force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
